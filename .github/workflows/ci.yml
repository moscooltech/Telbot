name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check all python files
        run: python -m compileall -q bot services utils app.py main.py config.py

      - name: Run pipeline logic tests
        run: python test_pipeline_logic.py

      - name: Run image generator unit tests (offline, no API keys)
        run: python test_image_gen_unit.py

      - name: Run live image generation smoke test
        continue-on-error: true
        run: python test_image_gen.py
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
